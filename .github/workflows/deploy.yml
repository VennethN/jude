name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "infra/docs/**", "infra/terraform/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jude
          POSTGRES_PASSWORD: jude_test
          POSTGRES_DB: jude_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/voice/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r apps/voice/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg poppler-utils libreoffice-writer
      - run: pnpm check
      - run: pnpm design:check
      - run: pnpm test
      - name: Check PostgreSQL persistence
        env:
          JUDE_TEST_DATABASE_URL: postgresql://jude:jude_test@127.0.0.1:5432/jude_test
        run: pnpm test
      - run: pnpm build
      - run: node apps/web/scripts/check-bundle.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: apps/web/test-results/
          retention-days: 7

  voice:
    name: Voice checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/voice
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jude
          POSTGRES_PASSWORD: jude_test
          POSTGRES_DB: jude_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/voice/requirements.txt
      - run: pip install -r requirements.txt ruff==0.17.4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: ruff check --isolated jude_voice tests
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
      - name: Check PostgreSQL persistence
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
          JUDE_TEST_DATABASE_URL: postgresql://jude:jude_test@127.0.0.1:5432/jude_test

  deploy:
    name: Build and deploy to AWS
    needs: [web, voice]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      DEPLOY_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      DEPLOY_OPS_BUCKET: ${{ secrets.DEPLOY_OPS_BUCKET }}
      DEPLOY_INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment settings
        run: |
          for name in AWS_REGION ECR_REPOSITORY DEPLOY_ROLE DEPLOY_OPS_BUCKET DEPLOY_INSTANCE_ID APP_URL; do
            test -n "${!name}" || { echo "Missing GitHub setting: $name"; exit 1; }
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push web and Python voice release
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: release-pyannote
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=jude-release
          cache-to: type=gha,scope=jude-release,mode=max
      - name: Upload release script
        run: aws s3 cp infra/deploy/run-voice-host.sh "s3://$DEPLOY_OPS_BUCKET/_deploy/releases/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/run.sh" --only-show-errors
      - name: Deploy on the instance through SSM
        env:
          JUDE_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: python3 infra/scripts/deploy-ci.py
      - name: Smoke test
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 "$APP_URL/healthz"; then exit 0; fi
            sleep 10
          done
          exit 1
