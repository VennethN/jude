name: Lint and deploy
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "infra/docs/**", "infra/terraform/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep the existing queue while runs from the previous workflow are active.
  group: Test and deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm design:check

  voice:
    name: Voice lint
    defaults:
      run:
        working-directory: apps/voice
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.17.4
      - run: ruff check --isolated jude_voice tests

  deploy:
    name: Build and deploy to AWS
    needs: [web, voice]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      DEPLOY_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      DEPLOY_OPS_BUCKET: ${{ secrets.DEPLOY_OPS_BUCKET }}
      DEPLOY_INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment settings
        run: |
          for name in AWS_REGION ECR_REPOSITORY DEPLOY_ROLE DEPLOY_OPS_BUCKET DEPLOY_INSTANCE_ID APP_URL; do
            test -n "${!name}" || { echo "Missing GitHub setting: $name"; exit 1; }
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push web and Python voice release
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: release-pyannote
          build-args: JUDE_REVISION=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=jude-release
          cache-to: type=gha,scope=jude-release,mode=max
      - name: Upload release script
        run: |
          aws s3 cp infra/deploy/run-voice-host.sh "s3://$DEPLOY_OPS_BUCKET/_deploy/releases/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/run.sh" --only-show-errors
          aws s3 cp infra/deploy/run-direct-voice.sh "s3://$DEPLOY_OPS_BUCKET/_deploy/releases/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/voice-gateway.sh" --only-show-errors
      - name: Deploy on the instance through SSM
        env:
          JUDE_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: python3 infra/scripts/deploy-ci.py
      - name: Smoke test
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 -D /tmp/jude-health.headers "$APP_URL/healthz"; then
              revision=$(awk 'tolower($1) == "x-jude-revision:" {gsub("\r", "", $2); print $2}' /tmp/jude-health.headers)
              if [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
              echo "Waiting for the expected release revision."
            fi
            sleep 10
          done
          exit 1
