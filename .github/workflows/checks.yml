name: Jude checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  applications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jude
          POSTGRES_PASSWORD: jude_test
          POSTGRES_DB: jude_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/voice/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r apps/voice/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg poppler-utils libreoffice-writer
      - run: pip install ruff==0.17.4
      - run: ruff check --isolated apps/voice/jude_voice apps/voice/tests
      - run: pnpm check
      - run: pnpm design:check
      - run: pnpm test && pnpm test:voice
      - name: Check PostgreSQL persistence
        env:
          JUDE_TEST_DATABASE_URL: postgresql://jude:jude_test@127.0.0.1:5432/jude_test
        run: pnpm test && pnpm test:voice
      - run: pnpm build
      - run: node apps/web/scripts/check-bundle.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: apps/web/test-results/
          retention-days: 7
