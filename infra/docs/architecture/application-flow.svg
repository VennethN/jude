<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1210" viewBox="0 0 1280 1210" role="img" aria-labelledby="title desc">
<title id="title">Jude service architecture and application flows</title>
<desc id="desc">CloudFront serves HTTPS from a Jakarta EC2 host running SvelteKit frontend and API plus Python voice. RDS and private S3 storage are in Jakarta. GitHub Actions checks both services, builds an ECR image and deploys it by digest through Systems Manager using OIDC.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="32" y="34" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">Jude · application data flows</text>
<text x="32" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Three transports: HTTP APIs + case SSE + voice WebSocket · server-authoritative permissions</text>
