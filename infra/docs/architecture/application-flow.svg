<text x="50" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">HttpOnly jude_session cookie</text>
<text x="50" y="191" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Versioned snapshots + case register</text>
<text x="50" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Bounded Maps in this tab&#x27;s memory</text>
<text x="50" y="241" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">BroadcastChannel invalidates tabs</text>
<text x="50" y="266" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Focus / visibility refresh guards</text>
