<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1030" viewBox="0 0 1280 1030" role="img" aria-labelledby="title desc">
<title id="title">Jude service architecture and application flows</title>
<desc id="desc">CloudFront serves HTTPS from a Jakarta EC2 host running SvelteKit frontend and API plus Python voice. RDS and private S3 storage are in Jakarta. GitHub Actions checks both services, builds an ECR image and deploys it by digest through Systems Manager using OIDC.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="32" y="34" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">Jude · release and operations</text>
<text x="32" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Current .github/workflows/deploy.yml path · one EC2 host · immutable image digest</text>
<rect x="32" y="108" width="378" height="170" rx="12" fill="#f8fafc" stroke="#172033" stroke-width="1.5"/>
<text x="50" y="136" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">1 · GitHub Actions checks</text>
<text x="50" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Pull requests / eligible main pushes</text>
<text x="50" y="191" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">pnpm check + design:check</text>
<text x="50" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Python Ruff lint</text>
<text x="50" y="241" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">CI does not run full test suites</text>
<rect x="492" y="108" width="756" height="170" rx="12" fill="#fffaf4" stroke="#ed7900" stroke-width="1.5"/>
<text x="510" y="136" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">2 · Build, authenticate, publish</text>
<text x="510" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">GitHub OIDC assumes scoped AWS deployment role</text>
<text x="510" y="191" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Docker release-pyannote target · Linux AMD64</text>
<text x="510" y="216" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Combined Node + Python image → immutable ECR digest</text>
<text x="510" y="241" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Deployment scripts uploaded to S3 _deploy/releases/</text>
<polyline points="410,190 492,190" fill="none" stroke="#ed7900" stroke-width="2" stroke-linejoin="round"/>
<polygon points="492,190 480.0,195.0 480.0,185.0" fill="#ed7900"/>
<rect x="425.4" y="154" width="49.2" height="26" rx="4" fill="white" stroke="none" stroke-width="1.5"/>
<text x="450" y="167" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ed7900" text-anchor="middle" dominant-baseline="central">pass</text>
<rect x="32" y="354" width="378" height="200" rx="12" fill="#fffaf4" stroke="#ed7900" stroke-width="1.5"/>
<text x="50" y="382" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">3 · SSM Run Command</text>
<text x="50" y="412" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">deploy-ci.py invokes target EC2</text>
<text x="50" y="437" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">EC2 role fetches ECR + scripts</text>
<text x="50" y="462" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Run run-voice-host.sh</text>
<text x="50" y="487" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Then configured direct gateway</text>
<text x="50" y="512" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">No SSH deployment step</text>
<rect x="492" y="354" width="756" height="200" rx="12" fill="#f7faff" stroke="#2874d8" stroke-width="1.5"/>
<text x="510" y="382" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">4 · EC2 runtime · Jakarta</text>
<text x="510" y="412" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">/jude-dev/runtime/* → temporary /run/jude/app.env</text>
<text x="510" y="437" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Parameter Store holds runtime config + credentials</text>
<text x="510" y="462" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">RDS CA bundle downloaded; mounted read-only</text>
<text x="510" y="487" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Optional offline Community-1 model mounted read-only</text>
<text x="510" y="512" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">jude-app + jude-proxy replaced on the single host</text>
<polyline points="870,278 870,314 220,314 220,354" fill="none" stroke="#ed7900" stroke-width="2" stroke-linejoin="round"/>
<polygon points="220,354 215.0,342.0 225.0,342.0" fill="#ed7900"/>
<rect x="478.9" y="301" width="132.20000000000002" height="26" rx="4" fill="white" stroke="none" stroke-width="1.5"/>
<text x="545" y="314" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ed7900" text-anchor="middle" dominant-baseline="central">OIDC → AWS SSM</text>
<polyline points="410,450 492,450" fill="none" stroke="#ed7900" stroke-width="2" stroke-linejoin="round"/>
<polygon points="492,450 480.0,455.0 480.0,445.0" fill="#ed7900"/>
<rect x="429.55" y="414" width="40.900000000000006" height="26" rx="4" fill="white" stroke="none" stroke-width="1.5"/>
<text x="450" y="427" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ed7900" text-anchor="middle" dominant-baseline="central">run</text>
<rect x="32" y="630" width="378" height="192" rx="12" fill="#f6fcf3" stroke="#469f25" stroke-width="1.5"/>
<text x="50" y="658" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">5 · Readiness and smoke test</text>
<text x="50" y="688" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Both :3000 and :3001 /healthz</text>
<text x="50" y="713" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Expected x-jude-revision checked</text>
<text x="50" y="738" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Proxy starts after app readiness</text>
<text x="50" y="763" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Workflow checks public /healthz</text>
<text x="50" y="788" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Replacement briefly interrupts traffic</text>
<rect x="492" y="630" width="352" height="192" rx="12" fill="#fbf8ff" stroke="#8050ce" stroke-width="1.5"/>
<text x="510" y="658" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">Persistent infrastructure</text>
<text x="510" y="688" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">RDS: app data + job leases</text>
<text x="510" y="713" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">S3/KMS: originals + audio</text>
<text x="510" y="738" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">ECR: immutable release images</text>
<text x="510" y="763" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">SSM: host administration</text>
<text x="510" y="788" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">EBS: host + optional model</text>
<rect x="922" y="630" width="326" height="192" rx="12" fill="#f8fafc" stroke="#172033" stroke-width="1.5"/>
<text x="940" y="658" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">Secrets and logs</text>
<text x="940" y="688" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">RDS-managed master secret</text>
<text x="940" y="713" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Stored in Secrets Manager</text>
<text x="940" y="738" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">RDS PostgreSQL → CloudWatch</text>
<text x="940" y="763" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Container logs: local rotation</text>
<text x="940" y="788" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">No app log sink asserted</text>
<polyline points="870,554 870,592 220,592 220,630" fill="none" stroke="#469f25" stroke-width="2" stroke-linejoin="round"/>
<polygon points="220,630 215.0,618.0 225.0,618.0" fill="#469f25"/>
<rect x="417.5" y="579" width="265.0" height="26" rx="4" fill="white" stroke="none" stroke-width="1.5"/>
<text x="550" y="592" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#469f25" text-anchor="middle" dominant-baseline="central">local health → public revision</text>
<rect x="32" y="892" width="1216" height="100" rx="12" fill="#f8fafc" stroke="#586579" stroke-width="1.5"/>
<text x="50" y="920" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033" text-anchor="start" dominant-baseline="central">Separate Terraform deployment option · not the workflow above</text>
<text x="50" y="950" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">app_image_digest + app_hostname create app-host EC2 with direct Caddy TLS and application Secrets Manager JSON.</text>
<text x="50" y="975" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#586579" text-anchor="start" dominant-baseline="central">Committed tfvars instead enables voice-host + CloudFront. These are separate provisioning paths; avoid assuming two live hosts.</text>
</svg>