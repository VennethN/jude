version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - corepack enable
            - corepack prepare pnpm@10.33.2 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm build:amplify
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - .pnpm-store/**/*
